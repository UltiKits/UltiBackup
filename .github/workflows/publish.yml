name: Verify & Publish Retained Release

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      source_head:
        description: Accepted source commit
        required: true
        type: string
      version:
        description: Accepted module version
        required: true
        type: string
      draft_release_id:
        description: Staged release ID
        required: true
        type: string
      manifest_sha256:
        description: Retained manifest SHA-256
        required: true
        type: string
      artifact_sha256:
        description: Retained primary JAR SHA-256
        required: true
        type: string
      package_metadata_sha256:
        description: Verified exact CLI metadata SHA-256
        required: true
        type: string
      installation_id:
        description: Single-installation correlation label
        required: true
        type: string

jobs:
  release-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: module-publish-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9  # v4.8.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Verify routine push
        if: github.event_name != 'workflow_dispatch'
        run: |
          mvn -B clean verify
          python3 -I -m unittest discover -s .github/scripts/tests -p 'test_publisher.py' -v

      - name: Set up Node.js
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '20'

      # Reviewed shared adapter: UltiKits/UltiTools-Reborn preparation PR #697.
      # Dispatch data is parsed by the canonical helper, never interpolated in shell.
      - name: Publish retained draft
        env:
          GH_TOKEN: ${{ github.token }}
          ULTIKITS_TOKEN: ${{ secrets.ULTIKITS_TOKEN }}
          RELEASE_TOOLS: ${{ runner.temp }}/release-tools
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "Routine run: nothing is installed or published."
            exit 0
          fi
          mkdir -p "$RELEASE_TOOLS"
          curl --fail --silent https://raw.githubusercontent.com/UltiKits/UltiTools-Reborn/f061477e9049f75ab297266d70604136998f01c6/.github/scripts/module-release.sh --output "$RELEASE_TOOLS/module-release.sh"
          curl --fail --silent https://raw.githubusercontent.com/UltiKits/UltiTools-Reborn/f061477e9049f75ab297266d70604136998f01c6/.github/scripts/release_artifacts.py --output "$RELEASE_TOOLS/release_artifacts.py"
          printf '%s  %s\n' \
            f78dce83a34493c74acc2d6e2246d20687bc4b641d70ff82b9b094a022aad08f "$RELEASE_TOOLS/module-release.sh" \
            c0f3ed372aeafdcac58745c70ba789c64b8f111c6ebec53c5f40372899915516 "$RELEASE_TOOLS/release_artifacts.py" | sha256sum --check --status
          python3 -I "$RELEASE_TOOLS/release_artifacts.py" dispatch-inputs verify \
            --repository UltiKits/UltiBackup --default-branch master --maintainer wisdommen > /dev/null
          bash "$RELEASE_TOOLS/module-release.sh" --repo UltiKits/UltiBackup --identify-string ultibackup \
            --default-branch master --maintainer wisdommen --jar-prefix UltiBackup \
            --helper-sha256 c0f3ed372aeafdcac58745c70ba789c64b8f111c6ebec53c5f40372899915516
